# 자동 실행 중지. 이 파일은 .github/workflows 밖에 있어서 GitHub Actions가 실행하지 않습니다.
# 다시 켜려면 .github/workflows/ingest-kbo.yml 로 되돌리세요.
name: Nightly KBO ingest

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Ingest into own DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_SEASON: ${{ vars.TARGET_SEASON }}
        run: python scripts/ingest_kbo.py
